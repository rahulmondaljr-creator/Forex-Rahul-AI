<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RAHUL QX PRO — LIVE</title>
<style>
body{background:#0b1220;color:#fff;font-family:Arial,sans-serif;padding:14px;max-width:640px;margin:0 auto}
h1{color:#00e5a0;text-align:center;margin:6px 0;font-size:24px}
.card{background:#172338;border-radius:12px;padding:14px;margin:12px 0}
.pill{display:inline-block;padding:6px 16px;border-radius:20px;font-weight:bold;font-size:13px}
.live{background:#0e3d2c;color:#00e5a0;border:1px solid #00e5a0}
.off{background:#3d1520;color:#ff5b6a;border:1px solid #ff5b6a}
table{width:100%;border-collapse:collapse;font-size:15px}
td,th{padding:8px 6px;border-bottom:1px solid #24344f;text-align:left}
tr.hl td{background:#0e3d2c}
tr.selRow{cursor:pointer}
tr.selRow:active td{background:#1d2f52}
.call{color:#00e5a0}.put{color:#ff5b6a}.wait{color:#ffb020}
.big{font-size:30px;font-weight:bold}
iframe{width:100%;height:380px;border:0;border-radius:8px}
small{color:#8fa3c0}
.center{text-align:center}
</style>
</head>
<body>
<h1>⚡ RAHUL QX PRO LIVE</h1>
<p class="center" style="margin-top:0"><span id="status" class="pill off">CHECKING...</span></p>

<div class="card">
  <h3 style="margin-top:0">📡 Latest Signal</h3>
  <div id="sigBox"><small>Loading...</small></div>
</div>

<div class="card">
  <h3 style="margin-top:0">💹 Live Prices <small>(Quotex)</small></h3>
  <table id="priceTable"><tr><td><small>Loading...</small></td></tr></table>
</div>

<div class="card">
  <h3 style="margin-top:0">🏆 Today's Stats</h3>
  <div id="statsBox"><small>Loading...</small></div>
</div>

<div class="card">
  <h3 style="margin-top:0">📊 Chart — <span id="chartPair">EUR/USD</span></h3>
  <iframe id="chart"></iframe>
  <p class="center"><small>Tap any pair above to view its chart</small></p>
  <p class="center"><small id="updated">never updated</small></p>
</div>

<p class="center"><small>📲 Signals also on Telegram · Support: @imrahulmondal<br>Trading involves risk. Trade responsibly.</small></p>

<script>
const USER = "rahulmondaljr-creator";
const REPO = "Forex-Rahul-AI";
const RAW = "https://raw.githubusercontent.com/" + USER + "/" + REPO + "/main/live.json";
let lastData = null;
let chartPair = "EUR/USD";

function fmtPrice(p){
  if(p >= 1000) return p.toFixed(2);
  if(p >= 100) return p.toFixed(3);
  return p.toFixed(5);
}
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

function setChart(pair){
  chartPair = pair;
  document.getElementById("chartPair").textContent = pair;
  document.getElementById("chart").src =
    "https://s.tradingview.com/widgetembed/?symbol=FX_IDC:" + pair.replace("/", "") +
    "&interval=5&theme=dark&style=1&locale=en";
}

function render(d){
  lastData = d;
  const now = Math.floor(Date.now()/1000);
  const age = now - (d.updated_ts || 0);
  const st = document.getElementById("status");
  if(age < 360){ st.className="pill live"; st.textContent = "🟢 LIVE · " + (d.mode === "OTC" ? "OTC MARKET" : "REAL MARKET"); }
  else { st.className="pill off"; st.textContent = "🔴 BOT OFFLINE · " + Math.floor(age/60) + " min ago"; }
  document.getElementById("updated").textContent = "updated " + (d.updated || "?") + " · auto-refresh 30s";

  const s = d.latest_signal || {};
  const box = document.getElementById("sigBox");
  if(s.pair){
    const dirCls = s.dir === "CALL" ? "call" : s.dir === "PUT" ? "put" : "wait";
    const left = (s.ts + (s.expmin||5)*60) - now;
    const expTxt = left > 0 ? ("⏳ " + Math.floor(left/60) + "m " + (left%60) + "s left") : ("✔ expired " + Math.floor(-left/60) + "m ago");
    box.innerHTML =
      '<div class="big ' + dirCls + '">' + esc(s.dir || "WAIT") + '</div>' +
      '<div style="font-size:18px;margin:6px 0"><b>' + esc(s.pair) + '</b> · ' + esc(s.kind || "") + '</div>' +
      '<div>🎯 Score: <b>' + esc(s.score != null ? s.score : "-") + '</b>/16 · Pattern: ' + esc(s.pattern || "-") + '</div>' +
      '<div>⏱ ' + (s.expmin||5) + '-min expiry · ' + expTxt + '</div>';
    if(chartPair !== s.pair) setChart(s.pair);
  } else {
    box.innerHTML = "<small>No signal yet — bot is scanning. Wait for the next setup.</small>";
  }

  const prices = d.prices || {};
  const keys = Object.keys(prices);
  let html = "<tr><th>Pair</th><th style='text-align:right'>Price</th></tr>";
  keys.forEach(k=>{
    const hl = (s.pair === k) ? " class='hl'" : "";
    html += "<tr class='selRow'" + hl + " data-pair='" + esc(k) + "'><td>" + esc(k) + "</td><td style='text-align:right'><code>" + fmtPrice(prices[k]) + "</code></td></tr>";
  });
  document.getElementById("priceTable").innerHTML = html;
  document.querySelectorAll(".selRow").forEach(r=>{
    r.onclick = ()=> setChart(r.getAttribute("data-pair"));
  });

  const st2 = d.stats || {};
  const tot = (st2.wins||0) + (st2.losses||0);
  const wr = tot ? Math.round(100*st2.wins/tot) : 0;
  document.getElementById("statsBox").innerHTML =
    "✅ Wins: <b>" + (st2.wins||0) + "</b> · ❌ Losses: <b>" + (st2.losses||0) + "</b> · ➖ Ties: <b>" + (st2.ties||0) + "</b><br>" +
    "🏆 Win-rate: <b>" + wr + "%</b> (" + tot + " trades) · Today: <b>" + (st2.today_trades||0) + "</b> trades";
}

async function load(){
  try{
    const r = await fetch(RAW + "?t=" + Date.now(), {cache:"no-store"});
    if(!r.ok) throw new Error("HTTP " + r.status);
    render(await r.json());
  }catch(e){
    const st = document.getElementById("status");
    st.className = "pill off";
    st.textContent = "🔴 NO DATA — bot off or file missing";
    document.getElementById("updated").textContent = "load failed: " + e.message;
  }
}

setChart("EUR/USD");
load();
setInterval(load, 30000);
setInterval(()=>{ if(lastData) render(lastData); }, 1000);
</script>
</body>
</html>
