<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forex Rahul AI</title>
  <style>
    body {
      background: #0b1220;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 20px;
    }
    h1 { color: #00e5a0; }
    .card {
      background: #172338;
      padding: 20px;
      border-radius: 15px;
      margin-top: 20px;
    }
    button {
      padding: 12px 25px;
      background: #00e5a0;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      margin: 8px;
    }
  </style>
</head>
<body>
  <h1>Forex Rahul AI</h1>
  <p>Professional Forex Market Analysis</p>

  <div class="card">
    <h2>Market Dashboard</h2>
    <p>Currency Pair: EUR/USD</p>
    <p>Market Data: Not Connected</p>
    <p>Signal: Waiting for Live Data</p>
  </div>

  <p>Timeframe</p>
  <button>1M</button>
  <button>5M</button>
  <button>15M</button>
  <button>1H</button>

  <p>Support • Resistance • Trend Analysis</p>
  <p>Live data connection will be added next.</p>
<div class="card">
  <h2>Live Forex Chart</h2>

  <div style="height:450px;width:100%;">
    <iframe
      src="https://s.tradingview.com/widgetembed/?symbol=FX:EURUSD&interval=5&theme=dark&style=1&locale=en"
      width="100%"
      height="100%"
      frameborder="0"
      allowfullscreen>
    </iframe>
  </div>
  
</body>
</html>
