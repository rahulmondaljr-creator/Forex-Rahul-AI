<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forex Rahul AI</title>

<style>
body {
  background: #0b1220;
  color: white;
  font-family: Arial, sans-serif;
  padding: 15px;
}
h1 { color: #00e5a0; text-align: center; }
.card {
  background: #172338;
  padding: 15px;
  border-radius: 12px;
  margin: 15px 0;
}
select, button {
  padding: 12px;
  border-radius: 8px;
  border: none;
  font-size: 16px;
  margin: 5px 0;
}
select { width: 100%; }
button {
  background: #00e5a0;
  cursor: pointer;
}
iframe {
  width: 100%;
  height: 420px;
  border: 0;
  border-radius: 8px;
}
</style>
</head>

<body>
<h1>Forex Rahul AI</h1>
<p style="text-align:center">Forex Market Dashboard</p>

<div class="card">
  <h3>Select Forex Market</h3>

  <select id="pair" onchange="changeMarket()">
    <option value="EURJPY">EUR/JPY</option>
    <option value="EURUSD" selected>EUR/USD</option>
    <option value="USDJPY">USD/JPY</option>
    <option value="AUDJPY">AUD/JPY</option>
    <option value="CADJPY">CAD/JPY</option>
    <option value="EURGBP">EUR/GBP</option>
    <option value="GBPUSD">GBP/USD</option>
    <option value="GBPJPY">GBP/JPY</option>
    <option value="AUDUSD">AUD/USD</option>
    <option value="AUDCAD">AUD/CAD</option>
    <option value="EURAUD">EUR/AUD</option>
    <option value="GBPAUD">GBP/AUD</option>
    <option value="USDCHF">USD/CHF</option>
    <option value="EURCAD">EUR/CAD</option>
    <option value="CHFJPY">CHF/JPY</option>
    <option value="GBPCAD">GBP/CAD</option>
    <option value="USDCAD">USD/CAD</option>
    <option value="GBPCHF">GBP/CHF</option>
    <option value="EURCHF">EUR/CHF</option>
    <option value="AUDCHF">AUD/CHF</option>
  </select>
</div>

<div class="card">
  <h3>Chart Timeframe</h3>
  <button onclick="changeTime(1)">1 Minute</button>
  <button onclick="changeTime(5)">5 Minutes</button>
  <button onclick="changeTime(15)">15 Minutes</button>
  <button onclick="changeTime(60)">1 Hour</button>
</div>

<div class="card">
  <h3 id="chartTitle">EUR/USD Live Chart</h3>
  <iframe id="chart"
    src="https://s.tradingview.com/widgetembed/?symbol=FX%3AEURUSD&interval=5&theme=dark&style=1&locale=en">
  </iframe>
  <p>Chart data is provided by TradingView.</p>
</div>

<div class="card">
  <h3>Market Analysis</h3>
  <p>Market: <span id="marketName">EUR/USD</span></p>
  <p>Signal: Not Connected</p>
  <p>Support / Resistance: Not Calculated</p>
</div>

<script>
let timeframe = 5;

function changeMarket() {
  const pair = document.getElementById("pair").value;
  const name = document.getElementById("pair")
    .options[document.getElementById("pair").selectedIndex].text;

  document.getElementById("marketName").textContent = name;
  document.getElementById("chartTitle").textContent =
    name + " Chart";

  loadChart(pair);
}

function changeTime(minutes) {
  timeframe = minutes;
  loadChart(document.getElementById("pair").value);
}

function loadChart(pair) {
  document.getElementById("chart").src =
    "https://s.tradingview.com/widgetembed/?symbol=FX%3A" +
    pair + "&interval=" + timeframe +
    "&theme=dark&style=1&locale=en";
}
</script>

</body>
</html>
